<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="800" height="800" fill="none">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#b32d3a" />
    </linearGradient>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Steins;Gate Dark Void Backdrop -->
  <rect width="100%" height="100%" fill="#0a0c10" />

  <!-- Outer Neural Ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#amberGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="100" cy="100" r="95" stroke="#ff8c00" stroke-width="1" stroke-opacity="0.3" />

  <!-- Neural A Glyph Lines -->
  <path d="M100 28 L42 165" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round" filter="url(#amberGlow)" />
  <path d="M100 28 L158 165" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round" filter="url(#amberGlow)" />
  <path d="M64 122 L136 122" stroke="url(#amberGrad)" stroke-width="5" stroke-linecap="round" filter="url(#amberGlow)" />
  <path d="M78 95 L122 95" stroke="#ff8c00" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Central Diamond Synapse -->
  <polygon points="100,58 116,95 100,116 84,95" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" />
  <circle cx="100" cy="95" r="4" fill="#ffb700" filter="url(#amberGlow)" />

  <!-- Neural Nodes -->
  <circle cx="100" cy="28" r="5" fill="#ffb700" />
  <circle cx="42" cy="165" r="5" fill="#b32d3a" />
  <circle cx="158" cy="165" r="5" fill="#b32d3a" />
  <circle cx="64" cy="122" r="4" fill="#ff8c00" />
  <circle cx="136" cy="122" r="4" fill="#ff8c00" />
  <line x1="100" y1="28" x2="100" y2="58" stroke="#ff8c00" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
  <line x1="100" y1="116" x2="100" y2="155" stroke="#b32d3a" stroke-width="2" opacity="0.6" />
</svg>
